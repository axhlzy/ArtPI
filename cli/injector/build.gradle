// =============================================================================
// :cli - the ArtPI CLI (ptrace injector + REPL), sources in cli/injector/.
// Compiles its own code, then embeds libartpi_agent.so and jadxcli.jar into the
// binary using XZ/LZMA compression (with automatic fallback).
// Produces: prebuild/bin/arm64-v8a/artpi-cli
// =============================================================================

import java.io.File
import java.io.InputStream
import java.io.OutputStream

def appendPayload = { OutputStream os, File payloadFile, String magicStr ->
    byte[] magic = magicStr.getBytes('US-ASCII')
    long payloadLen = payloadFile.length()
    payloadFile.withInputStream { is -> is.transferTo(os) }
    os.write(magic)
    byte[] sz = new byte[8]
    for (int i = 0; i < 8; i++) sz[i] = (byte) ((payloadLen >>> (8 * i)) & 0xFF)
    os.write(sz)
}

tasks.register('build') {
    group = 'artpi'
    description = 'Build the ArtPI CLI (own code) + embed libartpi_agent.so and jadxcli.jar -> prebuild/bin/artpi-cli.'
    dependsOn ':configureNative'
    dependsOn ':agent:build'   // the loaded agent must be built before packing
    doLast {
        def ninja = rootProject.ext.artpiNinja
        def bd = rootProject.ext.artpiBuildDir
        logger.lifecycle('[cli] ninja artpi-cli')
        project.exec {
            workingDir rootProject.projectDir
            commandLine([ninja, '-C', bd.absolutePath, 'artpi-cli'])
        }
        def raw = new File(bd, 'cli/injector/artpi-cli')
        def agent = new File(bd, 'src/agent/libartpi_agent.so')
        def jadxJar = new File(rootProject.projectDir, 'cli/jadxcli.jar')
        def out = new File(rootProject.projectDir, 'prebuild/bin/arm64-v8a/artpi-cli')
        if (!raw.exists()) throw new GradleException("raw CLI binary not found: ${raw}")
        if (!agent.exists()) throw new GradleException("agent not found: ${agent}")

        // Optional XZ compression helper for payloads
        def compressWithXz = { File srcFile, File dstFile ->
            def pyScript = new File(rootProject.projectDir, 'cli/pack_compress.py')
            def pyCandidates = rootProject.ext.artpiIsWin ? ['python', 'py', 'python3'] : ['python3', 'python']
            for (cand in pyCandidates) {
                try {
                    project.exec {
                        commandLine cand, pyScript.absolutePath, srcFile.absolutePath, dstFile.absolutePath
                    }
                    if (dstFile.exists() && dstFile.length() > 0) {
                        return true
                    }
                } catch (Exception ignored) {
                }
            }
            return false
        }

        // Compress agent.so
        def agentToPack = agent
        def agentXz = new File(bd, 'libartpi_agent.so.xz')
        if (compressWithXz(agent, agentXz)) {
            agentToPack = agentXz
            logger.lifecycle("[cli] agent compressed with XZ: ${agent.length()}B -> ${agentXz.length()}B")
        }

        // Compress jadxcli.jar
        def jadxToPack = jadxJar
        if (jadxJar.exists()) {
            def jadxXz = new File(bd, 'jadxcli.jar.xz')
            if (compressWithXz(jadxJar, jadxXz)) {
                jadxToPack = jadxXz
                logger.lifecycle("[cli] jadxcli.jar compressed with XZ: ${jadxJar.length()}B -> ${jadxXz.length()}B")
            }
        }

        out.parentFile.mkdirs()
        out.withOutputStream { os ->
            raw.withInputStream { is -> is.transferTo(os) }
            appendPayload(os, agentToPack, 'PPAYLOAD')
            if (jadxToPack.exists()) {
                appendPayload(os, jadxToPack, 'PJADXJAR')
            }
        }
        out.setExecutable(true, false)
        def jadxDesc = jadxToPack.exists() ? " + jadx ${jadxToPack.length()}B" : ""
        logger.lifecycle("[cli] packed -> ${out} (raw ${raw.length()}B + agent ${agentToPack.length()}B${jadxDesc} + trailers)")
        logger.lifecycle("[cli] Final artpi-cli size: ${out.length()} bytes (${String.format('%.2f', out.length() / (1024.0 * 1024.0))} MB)")
    }
}
